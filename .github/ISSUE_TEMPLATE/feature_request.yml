name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先说清楚**你现在的做法**和**它哪里别扭**，再讲你希望的方案。
        很多时候问题描述清楚了，方案会比原始设想更简单。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述当前的痛点，而不是直接跳到实现方案
      placeholder: |
        现在想只看某个公众号最近一周的未读，需要手动筛两次，很啰嗦。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案（可选）
      placeholder: 筛选条件可以保存成「预设」，下次一键切换。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代做法（可选）
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 登录 / 设备授权
        - 拉取与限速
        - 本地归档与备份
        - 阅读与标记
        - Notion 同步
        - 离线模式
        - 平板 / 大屏
        - 其他 / 不确定
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
        - label: 这个建议不涉及抓取或绕过服务端付费额度
          required: true
